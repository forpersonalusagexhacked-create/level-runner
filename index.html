<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Level Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%; overflow:hidden; background:#0f1220;
    font-family: 'Segoe UI', Arial, sans-serif; touch-action: manipulation;
  }
  #gameCanvas {
    display:block; width:100vw; height:100vh; background:linear-gradient(#1b2140,#0f1220 70%);
  }
  #hud {
    position:fixed; top:0; left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-size:16px; font-weight:600; pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(10,12,25,.88); color:#fff; padding:24px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:28px; margin-bottom:10px; }
  #overlay p { font-size:15px; opacity:.8; margin-bottom:22px; max-width:280px; }
  button {
    background:#4f8cff; color:#fff; border:none; padding:14px 30px;
    border-radius:30px; font-size:16px; font-weight:600; cursor:pointer;
  }
  button:active { transform:scale(0.96); }
  #tapHint {
    position:fixed; bottom:24px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.55); font-size:13px; pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="levelLabel">Level 1</div>
  <div id="distLabel">0 / 100 m</div>
</div>

<div id="tapHint">Tap anywhere to jump</div>

<div id="overlay">
  <h1 id="overlayTitle">Level Runner</h1>
  <p id="overlayText">3 levels. Tap to jump over obstacles. Reach the finish line to clear each level.</p>
  <button id="overlayBtn">Start</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const hudLevel = document.getElementById('levelLabel');
  const hudDist = document.getElementById('distLabel');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const tapHint = document.getElementById('tapHint');

  let W, H, groundY;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    groundY = H * 0.75;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Level configuration ----
  const LEVELS = [
    { target: 900,  speed: 5.2, gap: [70, 110], obstacleH: [30, 50] },
    { target: 1300, speed: 6.6, gap: [55, 95],  obstacleH: [30, 65] },
    { target: 1700, speed: 8.0, gap: [45, 85],  obstacleH: [30, 80] },
  ];

  let state = 'menu'; // menu | playing | levelComplete | gameover | win
  let levelIndex = 0;
  let distance = 0;
  let obstacles = [];
  let spawnTimer = 0;

  const player = {
    x: 0, y: 0, size: 42,
    vy: 0, grounded: true,
    gravity: 0.9, jumpForce: -16
  };

  function resetPlayer(){
    player.x = W * 0.18;
    player.y = groundY - player.size;
    player.vy = 0;
    player.grounded = true;
  }

  function startLevel(i){
    levelIndex = i;
    distance = 0;
    obstacles = [];
    spawnTimer = 0;
    resetPlayer();
    state = 'playing';
    overlay.classList.add('hidden');
    tapHint.style.display = 'block';
    updateHud();
  }

  function updateHud(){
    const cfg = LEVELS[levelIndex];
    hudLevel.textContent = 'Level ' + (levelIndex + 1);
    hudDist.textContent = Math.min(Math.floor(distance), cfg.target) + ' / ' + cfg.target + ' m';
  }

  function jump(){
    if (state !== 'playing') return;
    if (player.grounded){
      player.vy = player.jumpForce;
      player.grounded = false;
    }
  }

  function spawnObstacle(cfg){
    const h = cfg.obstacleH[0] + Math.random() * (cfg.obstacleH[1] - cfg.obstacleH[0]);
    const w = 24 + Math.random() * 18;
    obstacles.push({ x: W + 20, y: groundY - h, w: w, h: h });
  }

  function rectsOverlap(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(){
    if (state !== 'playing') return;
    const cfg = LEVELS[levelIndex];

    // physics
    player.vy += player.gravity;
    player.y += player.vy;
    if (player.y >= groundY - player.size){
      player.y = groundY - player.size;
      player.vy = 0;
      player.grounded = true;
    }

    // spawn obstacles
    spawnTimer -= 1;
    if (spawnTimer <= 0){
      spawnObstacle(cfg);
      const [minGap, maxGap] = cfg.gap;
      spawnTimer = minGap + Math.random() * (maxGap - minGap);
    }

    // move obstacles + distance
    distance += cfg.speed * 0.16;
    for (let ob of obstacles) ob.x -= cfg.speed;
    obstacles = obstacles.filter(ob => ob.x + ob.w > -10);

    // collision
    const playerBox = { x: player.x + 6, y: player.y + 6, w: player.size - 12, h: player.size - 12 };
    for (let ob of obstacles){
      if (rectsOverlap(playerBox, ob)){
        state = 'gameover';
        showOverlay('Ouch!', 'You crashed on Level ' + (levelIndex + 1) + '. Try again.', 'Retry Level');
        return;
      }
    }

    updateHud();

    if (distance >= cfg.target){
      if (levelIndex + 1 < LEVELS.length){
        state = 'levelComplete';
        showOverlay('Level ' + (levelIndex + 1) + ' Complete!', 'Ready for the next level?', 'Next Level');
      } else {
        state = 'win';
        showOverlay('You Win!', 'All levels cleared. Great run!', 'Play Again');
      }
    }
  }

  function showOverlay(title, text, btnLabel){
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btnLabel;
    overlay.classList.remove('hidden');
    tapHint.style.display = 'none';
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // ground
    ctx.fillStyle = '#2a3060';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = 'rgba(255,255,255,.15)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    // player
    ctx.fillStyle = '#4f8cff';
    ctx.beginPath();
    ctx.roundRect(player.x, player.y, player.size, player.size, 8);
    ctx.fill();

    // obstacles
    ctx.fillStyle = '#ff5f6d';
    for (let ob of obstacles){
      ctx.beginPath();
      ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
      ctx.fill();
    }
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // input
  window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive:false });
  window.addEventListener('mousedown', jump);
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

  overlayBtn.addEventListener('click', () => {
    if (state === 'menu') startLevel(0);
    else if (state === 'gameover') startLevel(levelIndex);
    else if (state === 'levelComplete') startLevel(levelIndex + 1);
    else if (state === 'win') startLevel(0);
  });

  resetPlayer();
  draw();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
